name: validate-export

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly: catches drift nobody happened to look at

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - run: python tools/validate_export.py
